<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | QueueSeva</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/styles.css" rel="stylesheet"></head><body><nav class="navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">Q</span>QueueSeva</a><a class="nav-link" href="user-dashboard.html">My bookings</a><div id="nav-auth"></div></div></nav><main class="container section-space"><div class="row justify-content-center"><div class="col-lg-8"><span class="badge badge-demo">CITIZEN ACCOUNT</span><h1 class="h2 mt-2">Profile and security</h1><p class="text-secondary">Update your contact details and account password. No government ID numbers are needed.</p><div class="card p-4 p-md-5 mb-4"><h2 class="h5">Personal details</h2><form id="profile-form"><label class="form-label" for="profile-name">Full name</label><input id="profile-name" name="name" class="form-control mb-3" minlength="2" maxlength="90" required><label class="form-label" for="profile-email">Email</label><input id="profile-email" name="email" type="email" class="form-control mb-3" readonly><label class="form-label" for="profile-mobile">Mobile number</label><input id="profile-mobile" name="mobile" type="tel" class="form-control mb-3" pattern="[0-9+() -]{7,20}" required><button class="btn btn-primary-custom" type="submit">Save profile</button></form></div><div class="card p-4 p-md-5"><h2 class="h5">Change password</h2><form id="password-form"><label class="form-label" for="current-password">Current password</label><input id="current-password" name="currentPassword" type="password" class="form-control mb-3" autocomplete="current-password" required><label class="form-label" for="new-password">New password</label><input id="new-password" name="newPassword" type="password" class="form-control mb-3" minlength="8" autocomplete="new-password" required><label class="form-label" for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" type="password" class="form-control mb-3" minlength="8" autocomplete="new-password" required><button class="btn btn-primary-custom" type="submit">Change password</button></form></div></div></div></main><footer class="footer"><div class="container">QueueSeva · Demonstration only</div></footer><script src="js/app.js"></script><script src="js/profile.js"></script></body></html>
