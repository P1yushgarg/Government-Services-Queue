<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | QueueSeva</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/styles.css" rel="stylesheet"></head><body><nav class="navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">Q</span>QueueSeva</a><div id="nav-auth"></div></div></nav><main class="container section-space"><div class="row justify-content-center"><div class="col-md-8 col-lg-6"><div class="card p-4 p-md-5"><h1 class="h3">Create your citizen account</h1><p class="text-secondary">Use the demo portal to book and follow sample queue tokens.</p><form data-auth="signup"><label class="form-label">Full name</label><input name="name" class="form-control mb-3" minlength="2" maxlength="90" autocomplete="name" required><label class="form-label">Email</label><input name="email" type="email" class="form-control mb-3" autocomplete="email" required><label class="form-label">Mobile number</label><input name="mobile" type="tel" class="form-control mb-3" pattern="[0-9+() -]{7,20}" autocomplete="tel" required><label class="form-label">Password</label><div class="input-group mb-3"><input id="pass" name="password" type="password" class="form-control" minlength="8" required><button class="btn btn-outline-custom toggle-password" type="button" data-target="#pass">Show</button></div><label class="form-label">Confirm password</label><input name="confirmPassword" type="password" class="form-control mb-3" minlength="8" required><div class="form-check mb-3"><input name="terms" value="true" type="checkbox" class="form-check-input" id="terms" required><label class="form-check-label" for="terms">I accept the demo portal terms and privacy notice.</label></div><button class="btn btn-primary-custom w-100" type="submit">Create account</button></form><p class="mt-3 mb-0">Already registered? <a href="login.html">Sign in</a></p></div></div></div></main><footer class="footer"><div class="container">Demo only · Do not enter government ID numbers.</div></footer><script src="js/app.js"></script><script src="js/auth.js"></script><script>document.querySelector('form').addEventListener('submit',e=>{let f=e.currentTarget;if(f.password.value!==f.confirmPassword.value){e.preventDefault();notice('Passwords do not match','danger')}})</script></body></html>
