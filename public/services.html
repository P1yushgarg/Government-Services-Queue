<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services | QueueSeva</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/styles.css" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">Q</span>QueueSeva</a><button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><div class="navbar-nav me-auto"><a class="nav-link" href="services.html">Services</a><a class="nav-link" href="check-token.html">Track token</a><a class="nav-link" href="user-dashboard.html">My bookings</a><a class="nav-link admin-link d-none" href="admin-dashboard.html">Operations</a></div><div class="navbar-nav align-items-lg-center" id="nav-auth"></div></div></div></nav><main class="container section-space"><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><span class="badge badge-demo">DEMO DATA</span><h1 class="h2 mt-2">Find a service</h1><p class="text-secondary mb-0">Sample offices, hours and queue estimates for this demonstration.</p></div><div class="service-filters"><input id="search" class="form-control" placeholder="Search services" aria-label="Search services"><select id="category" class="form-select" aria-label="Filter by category"><option value="">All categories</option></select><select id="office-status" class="form-select" aria-label="Filter by office status"><option value="">All offices</option><option value="open">Open</option><option value="closed">Closed</option></select></div></div><div id="services" class="row g-4"><div class="col-12 text-center p-5">Loading demo services…</div></div></main><footer class="footer"><div class="container">QueueSeva · Demonstration only · No government system connection</div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>let all=[];async function render(){try{all=await api('/api/services');let cats=[...new Set(all.map(s=>s.category))];$('#category').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');paint()}catch(e){$('#services').innerHTML=`<p>${esc(e.message)}</p>`}}function paint(){let q=$('#search').value.toLowerCase(),cat=$('#category').value,officeStatus=$('#office-status').value;let list=all.filter(s=>(s.name+s.description+s.office).toLowerCase().includes(q)&&(!cat||s.category===cat)&&(!officeStatus||(officeStatus==='open'?s.open:!s.open)));$('#services').innerHTML=list.length?list.map(s=>`<div class="col-md-6 col-xl-4"><article class="card service-card"><div class="card-body p-4"><div class="d-flex justify-content-between"><span class="badge text-bg-light">${esc(s.category)}</span><span class="badge ${s.open?'text-bg-success':'text-bg-secondary'}">${s.open?'Open':'Closed'}</span></div><h2 class="h5 mt-3">${esc(s.name)}</h2><p>${esc(s.description)}</p><p class="small text-secondary mb-1"><b>Sample office</b><br>${esc(s.office)}</p><p class="small text-secondary mb-1"><b>Hours:</b> ${esc(s.hours)}</p><p class="small text-secondary"><b>${s.counters} counters</b> · Current ${esc(s.currentToken)} · ${s.waiting} waiting<br>Estimated wait ~${s.waiting*s.duration} min</p><span class="badge badge-demo align-self-start mb-3">DEMO DATA · ESTIMATE</span><a class="btn btn-primary-custom" href="book-token.html?service=${encodeURIComponent(s.id)}">Book a token</a></div></article></div>`).join(''):'<p>No matching demo services.</p>'}$('#search').addEventListener('input',paint);$('#category').addEventListener('change',paint);$('#office-status').addEventListener('change',paint);render();</script></body></html>
